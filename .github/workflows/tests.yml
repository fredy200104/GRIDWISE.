name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [16.x, 18.x]
    
    services:
      firestore-emulator:
        image: mtlynch/firestore-emulator
        ports:
          - 4000:4000
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        working-directory: ./gridwise-backend
        run: npm ci
      
      - name: Run linter
        working-directory: ./gridwise-backend
        run: npm run lint
        continue-on-error: true
      
      - name: Run unit tests
        working-directory: ./gridwise-backend
        run: npm run test:unit
        env:
          FIREBASE_EMULATOR_HOST: localhost:4000
      
      - name: Run integration tests
        working-directory: ./gridwise-backend
        run: npm run test:integration
        env:
          FIREBASE_EMULATOR_HOST: localhost:4000
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./gridwise-backend/coverage/lcov.info
          flags: backend
          name: Backend Coverage
        continue-on-error: true

  frontend-tests:
    name: Frontend Tests (Flutter)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.x'
          channel: 'stable'
      
      - name: Get dependencies
        working-directory: ./lib
        run: flutter pub get
      
      - name: Analyze code
        working-directory: ./lib
        run: flutter analyze
        continue-on-error: true
      
      - name: Run tests
        working-directory: ./lib
        run: flutter test --coverage
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./lib/coverage/lcov.info
          flags: frontend
          name: Frontend Coverage
        continue-on-error: true

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    
    needs: [backend-tests, frontend-tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'
      
      - name: Build backend
        working-directory: ./gridwise-backend
        run: npm run build
        continue-on-error: true
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
      
      - name: Build Flutter for web
        working-directory: ./lib
        run: flutter build web --release
        continue-on-error: true

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, build]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.backend-tests.result }}" = "failure" ] || \
             [ "${{ needs.frontend-tests.result }}" = "failure" ] || \
             [ "${{ needs.build.result }}" = "failure" ]; then
            echo "❌ Some tests failed. Please review the logs above."
            exit 1
          else
            echo "✅ All tests passed successfully!"
          fi
