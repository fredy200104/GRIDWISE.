name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

jobs:
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: TruffleHog Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  dependency-scanning:
    name: Dependency Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      
      - name: NPM Audit (Backend)
        working-directory: ./gridwise-backend
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Run safety check (if Python present)
        run: |
          pip install safety
          safety check --json || true
        continue-on-error: true

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      
      - name: Install dependencies (Backend)
        working-directory: ./gridwise-backend
        run: npm ci
      
      - name: ESLint
        working-directory: ./gridwise-backend
        run: npm run lint
        continue-on-error: true
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
      
      - name: Flutter Analyze (Frontend)
        working-directory: ./lib
        run: flutter analyze
        continue-on-error: true

  security-headers:
    name: Security Headers Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Check for hardcoded credentials
        run: |
          echo "Checking for common secret patterns..."
          
          if grep -r "password\s*=\s*['\"]" --include="*.js" --include="*.env" --include="*.json"; then
            echo "⚠️ Found potential hardcoded password!"
            exit 1
          fi
          
          if grep -r "api_key\s*=\s*['\"]" --include="*.js"; then
            echo "⚠️ Found potential hardcoded API key!"
            exit 1
          fi
          
          echo "✅ No obvious hardcoded credentials found"

  dockerfile-security:
    name: Dockerfile Security
    runs-on: ubuntu-latest
    if: hashFiles('./Dockerfile') != ''
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Hadolint (Docker security)
        uses: hadolint/hadolint-action@v3.0.0
        with:
          dockerfile: Dockerfile
        continue-on-error: true

  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [secret-scanning, dependency-scanning, code-quality]
    if: always()
    
    steps:
      - name: Report Results
        run: |
          echo "🔐 Security Scan Summary"
          echo "========================"
          echo ""
          echo "✅ Secret Scanning: ${{ needs.secret-scanning.result }}"
          echo "✅ Dependency Scanning: ${{ needs.dependency-scanning.result }}"
          echo "✅ Code Quality: ${{ needs.code-quality.result }}"
          echo ""
          echo "If any checks failed, review the logs above."
